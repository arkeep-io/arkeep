name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # The GUI, which the server embeds, is built here and handed to the release
  # job as an artifact. Installing and building it runs code from the npm
  # dependencies (Vite and its plugins), so this job has no environment, no
  # secret and a read-only token: that code never runs next to the registry
  # credentials or the package signing key (P-04, ADR 0021). No cache is
  # restored: the output ends up in the released server binary (P-06).
  gui:
    name: GUI
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node >= 25 no longer bundles corepack. pnpm/action-setup installs the
      # version pinned by packageManager in gui/package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: gui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build the GUI
        run: cd gui && pnpm install --frozen-lockfile && pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-dist
          path: gui/dist
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: gui
    runs-on: ubuntu-26.04
    # The Docker Hub organization access token lives in this environment,
    # which only v* tags and main can deploy to: a workflow pushed on any
    # other ref cannot read it (P-01, ADR 0017).
    environment: release
    permissions:
      contents: write
      packages: write
      # Signing and storing the build provenance (P-02).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Refuses to release from a tag that is malformed or points to a commit
      # outside the allowed branches, before anything is built in this job or
      # any registry credential is used (the gui job holds neither). Stable
      # tags (vX.Y.Z) must be in the history of main; beta and rc tags
      # (vX.Y.Z-beta.N, vX.Y.Z-rc.N) in the history of main or develop. The tag is peeled to its commit, so
      # lightweight and annotated tags are handled alike.
      - name: Validate release tag and source commit
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF}" != "refs/tags/${GITHUB_REF_NAME}" ]; then
            echo "::error::A release must be started by a tag push, got ref '${GITHUB_REF}'."
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          num='(0|[1-9][0-9]*)'
          stable_re="^v${num}\.${num}\.${num}$"
          prerelease_re="^v${num}\.${num}\.${num}-(beta|rc)\.${num}$"
          if [[ "$tag" =~ $stable_re ]]; then
            allowed=(main)
          elif [[ "$tag" =~ $prerelease_re ]]; then
            allowed=(main develop)
          else
            echo "::error::Tag '${tag}' is not a release tag: use vX.Y.Z, vX.Y.Z-beta.N or vX.Y.Z-rc.N, with no leading zeros."
            exit 1
          fi

          for branch in "${allowed[@]}"; do
            if ! git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"; then
              echo "::error::Could not fetch origin/${branch} to validate tag '${tag}'."
              exit 1
            fi
          done

          if ! tag_commit=$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}"); then
            echo "::error::Tag '${tag}' does not resolve to a commit in the checkout."
            exit 1
          fi
          head_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::The checked-out commit ${head_commit} is not the commit of tag '${tag}' (${tag_commit})."
            exit 1
          fi

          for branch in "${allowed[@]}"; do
            if git merge-base --is-ancestor "$tag_commit" "refs/remotes/origin/${branch}"; then
              echo "Tag ${tag} (${tag_commit}) is in the history of origin/${branch}."
              exit 0
            fi
          done

          printf -v branches 'origin/%s or ' "${allowed[@]}"
          echo "::error::Tag '${tag}' points to ${tag_commit}, which is not in the history of ${branches% or }. Stable tags must be on main; beta and rc tags on main or develop."
          exit 1

      # No cache: this job holds the registry credentials and the package
      # signing key, and must not restore what another run wrote (P-06).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      # The GUI built by the gui job, embedded by the GoReleaser hooks. No npm
      # code runs in this job (P-04, ADR 0021).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-dist
          path: gui/dist

      # QEMU and Buildx are required for cross-platform Docker image builds.
      # Without them, building linux/arm64 images on the amd64 runner fails
      # with "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          # An organization access token logs in as the organization.
          username: arkeepio
          password: ${{ secrets.DOCKERHUB_ORG_TOKEN }}

      # Collects the GitHub logins of everyone who authored their first commit
      # since the previous tag (bots excluded) and exposes them to GoReleaser
      # as CONTRIBUTORS, rendered in the release notes footer. A login with any
      # commit reachable from the previous tag is not a first-time contributor.
      # Commits whose email is not linked to a GitHub account have no login and
      # are skipped.
      - name: Collect first-time contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous tag, skipping contributors"
            exit 0
          fi
          contributors=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}" \
              --jq '.commits[].author.login // empty' \
            | { grep -v -e '\[bot\]$' -e '^dependabot$' || true; } \
            | sort -fu \
            | while read -r login; do
                n=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=${prev}&author=${login}&per_page=1" --jq 'length')
                if [ "$n" = "0" ]; then echo "@${login}"; fi
              done \
            | paste -sd ' ' -)
          echo "First-time contributors since ${prev}: ${contributors}"
          echo "CONTRIBUTORS=${contributors}" >> "$GITHUB_ENV"

      # GoReleaser signs the agent .rpm packages with the package repository
      # key (ADR 0020), read from this file. A missing secret stops the
      # release rather than publish unsigned packages. The key stays on disk
      # only while GoReleaser runs, and only GoReleaser gets its path
      # (ADR 0021).
      - name: Prepare the package signing key
        env:
          PACKAGES_SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PACKAGES_SIGNING_KEY" ]; then
            echo "::error::The PACKAGES_SIGNING_KEY secret of the release environment is empty."
            exit 1
          fi
          (umask 077 && printf '%s\n' "$PACKAGES_SIGNING_KEY" > "${RUNNER_TEMP}/packages-signing-key.asc")

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARKEEP_PACKAGES_SIGNING_KEY_FILE: ${{ runner.temp }}/packages-signing-key.asc

      - name: Remove the package signing key
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/packages-signing-key.asc"

      # The Helm chart is published as an OCI artifact on GHCR and Docker Hub,
      # versioned like the release (ADR 0014). It runs after GoReleaser so the
      # images it points to already exist. helm is a Go tool: go install pins
      # it and checks it against the Go checksum database (ADR 0013).
      - name: Install Helm
        run: GOWORK=off go install helm.sh/helm/v4/cmd/helm@v4.3.1

      - name: Publish the Helm chart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_ORG_TOKEN: ${{ secrets.DOCKERHUB_ORG_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          chart_dir="${RUNNER_TEMP}/chart"
          helm package deploy/helm/arkeep --version "$version" --app-version "$GITHUB_REF_NAME" --destination "$chart_dir"
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin
          echo "$DOCKERHUB_ORG_TOKEN" | helm registry login registry-1.docker.io --username arkeepio --password-stdin
          helm push "${chart_dir}/arkeep-${version}.tgz" oci://ghcr.io/arkeep-io/charts 2>&1 | tee "${RUNNER_TEMP}/helm-push.log"
          helm push "${chart_dir}/arkeep-${version}.tgz" oci://registry-1.docker.io/arkeepio

      # Build provenance (P-02): one attestation, signed with Sigstore and kept
      # by GitHub, covering every published artifact: the archives and
      # checksums.txt, the server and agent images (GHCR and Docker Hub get the
      # same build, so one digest each) and the Helm chart. Users check a
      # download or an image with `gh attestation verify ... --repo
      # arkeep-io/arkeep`.
      - name: Collect the artifacts to attest
        shell: bash
        run: |
          set -euo pipefail
          subjects="${RUNNER_TEMP}/subjects.txt"
          cp dist/checksums.txt "$subjects"
          (cd dist && sha256sum checksums.txt) >> "$subjects"
          add() {
            if [[ ! "$1" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No digest found for $2."
              exit 1
            fi
            echo "${1#sha256:}  $2" >> "$subjects"
          }
          for image in arkeep-server arkeep-agent; do
            add "$(docker buildx imagetools inspect "ghcr.io/arkeep-io/${image}:${GITHUB_REF_NAME}" --format '{{.Manifest.Digest}}')" "ghcr.io/arkeep-io/${image}"
          done
          add "$(grep -o 'sha256:[0-9a-f]\{64\}' "${RUNNER_TEMP}/helm-push.log" | head -n 1)" "ghcr.io/arkeep-io/charts/arkeep"
          cat "$subjects"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt

      # The APT and RPM repository at pkg.arkeep.io (ADR 0020), rebuilt from
      # the agent packages of the last stable releases, this one included,
      # once their attestation exists: the script checks it before signing.
      # Stable releases only. The rclone binary is the pinned and verified
      # one the GoReleaser hooks downloaded for the agent (ADR 0013). The
      # signing key is written after the tools are installed and the releases
      # downloaded, and removed as soon as the repository is signed
      # (ADR 0021). If this step fails, the release is otherwise complete: run
      # the Agent repository workflow from main.
      - name: Publish the agent package repository
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_SIGNING_KEY: ${{ secrets.PACKAGES_SIGNING_KEY }}
          RCLONE: agent/internal/restic/bin/rclone_linux_amd64
          PACKAGES_R2_ENDPOINT: ${{ vars.PACKAGES_R2_ENDPOINT }}
          PACKAGES_R2_ACCESS_KEY_ID: ${{ secrets.PACKAGES_R2_ACCESS_KEY_ID }}
          PACKAGES_R2_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c rpm
          scripts/agent-repository.sh fetch "${RUNNER_TEMP}/releases"
          key_file="${RUNNER_TEMP}/packages-signing-key.asc"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s\n' "$PACKAGES_SIGNING_KEY" > "$key_file")
          ARKEEP_PACKAGES_SIGNING_KEY_FILE=$key_file \
            scripts/agent-repository.sh build "${RUNNER_TEMP}/releases" "${RUNNER_TEMP}/repository"
          rm -f "$key_file"
          scripts/agent-repository.sh upload "${RUNNER_TEMP}/repository"

      # The Home Assistant app describes the agent image of this release
      # (ADR 0018). Moving the home-assistant branch is what offers the new
      # version to Home Assistant users, so it comes last, once the image is
      # published and attested, and only for stable releases. The checkout
      # keeps no credentials: the token is passed to git for this push only.
      - name: Publish the Home Assistant app
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          scripts/publish-home-assistant-app.sh "$GITHUB_REF_NAME" origin
