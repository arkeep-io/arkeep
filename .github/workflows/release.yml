name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # Node >= 25 no longer bundles corepack. pnpm/action-setup installs the
      # version pinned by packageManager in gui/package.json, and must run
      # before setup-node so its pnpm cache lookup can find the binary.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: gui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: gui/pnpm-lock.yaml

      # QEMU and Buildx are required for cross-platform Docker image builds.
      # Without them, building linux/arm64 images on the amd64 runner fails
      # with "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Collects the GitHub logins of everyone who authored a commit since the
      # previous tag (bots excluded) and exposes them to GoReleaser as
      # CONTRIBUTORS, rendered in the release notes footer. Commits whose email
      # is not linked to a GitHub account have no login and are skipped.
      - name: Collect contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous tag, skipping contributors"
            exit 0
          fi
          contributors=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}" \
              --jq '.commits[].author.login // empty' \
            | { grep -v -e '\[bot\]$' -e '^dependabot$' || true; } \
            | sort -fu \
            | sed 's/^/@/' \
            | paste -sd ' ' -)
          echo "Contributors since ${prev}: ${contributors}"
          echo "CONTRIBUTORS=${contributors}" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}