name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Refuses to release from a tag that is malformed or points to a commit
      # outside the allowed branches, before anything is built or any
      # registry credential is used. Stable tags (vX.Y.Z) must be in the
      # history of main; beta and rc tags (vX.Y.Z-beta.N, vX.Y.Z-rc.N) in the
      # history of main or develop. The tag is peeled to its commit, so
      # lightweight and annotated tags are handled alike.
      - name: Validate release tag and source commit
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF}" != "refs/tags/${GITHUB_REF_NAME}" ]; then
            echo "::error::A release must be started by a tag push, got ref '${GITHUB_REF}'."
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          num='(0|[1-9][0-9]*)'
          stable_re="^v${num}\.${num}\.${num}$"
          prerelease_re="^v${num}\.${num}\.${num}-(beta|rc)\.${num}$"
          if [[ "$tag" =~ $stable_re ]]; then
            allowed=(main)
          elif [[ "$tag" =~ $prerelease_re ]]; then
            allowed=(main develop)
          else
            echo "::error::Tag '${tag}' is not a release tag: use vX.Y.Z, vX.Y.Z-beta.N or vX.Y.Z-rc.N, with no leading zeros."
            exit 1
          fi

          for branch in "${allowed[@]}"; do
            if ! git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"; then
              echo "::error::Could not fetch origin/${branch} to validate tag '${tag}'."
              exit 1
            fi
          done

          if ! tag_commit=$(git rev-parse --verify --quiet "refs/tags/${tag}^{commit}"); then
            echo "::error::Tag '${tag}' does not resolve to a commit in the checkout."
            exit 1
          fi
          head_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::The checked-out commit ${head_commit} is not the commit of tag '${tag}' (${tag_commit})."
            exit 1
          fi

          for branch in "${allowed[@]}"; do
            if git merge-base --is-ancestor "$tag_commit" "refs/remotes/origin/${branch}"; then
              echo "Tag ${tag} (${tag_commit}) is in the history of origin/${branch}."
              exit 0
            fi
          done

          printf -v branches 'origin/%s or ' "${allowed[@]}"
          echo "::error::Tag '${tag}' points to ${tag_commit}, which is not in the history of ${branches% or }. Stable tags must be on main; beta and rc tags on main or develop."
          exit 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work

      # Node >= 25 no longer bundles corepack. pnpm/action-setup installs the
      # version pinned by packageManager in gui/package.json, and must run
      # before setup-node so its pnpm cache lookup can find the binary.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: gui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: gui/pnpm-lock.yaml

      # QEMU and Buildx are required for cross-platform Docker image builds.
      # Without them, building linux/arm64 images on the amd64 runner fails
      # with "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Collects the GitHub logins of everyone who authored their first commit
      # since the previous tag (bots excluded) and exposes them to GoReleaser
      # as CONTRIBUTORS, rendered in the release notes footer. A login with any
      # commit reachable from the previous tag is not a first-time contributor.
      # Commits whose email is not linked to a GitHub account have no login and
      # are skipped.
      - name: Collect first-time contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous tag, skipping contributors"
            exit 0
          fi
          contributors=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}" \
              --jq '.commits[].author.login // empty' \
            | { grep -v -e '\[bot\]$' -e '^dependabot$' || true; } \
            | sort -fu \
            | while read -r login; do
                n=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=${prev}&author=${login}&per_page=1" --jq 'length')
                if [ "$n" = "0" ]; then echo "@${login}"; fi
              done \
            | paste -sd ' ' -)
          echo "First-time contributors since ${prev}: ${contributors}"
          echo "CONTRIBUTORS=${contributors}" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Helm chart is published as an OCI artifact on GHCR and Docker Hub,
      # versioned like the release (ADR 0014). It runs after GoReleaser so the
      # images it points to already exist. helm is a Go tool: go install pins
      # it and checks it against the Go checksum database (ADR 0013).
      - name: Install Helm
        run: GOWORK=off go install helm.sh/helm/v4/cmd/helm@v4.3.1

      - name: Publish the Helm chart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart_dir="${RUNNER_TEMP}/chart"
          helm package deploy/helm/arkeep --version "$version" --app-version "$GITHUB_REF_NAME" --destination "$chart_dir"
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin
          echo "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          helm push "${chart_dir}/arkeep-${version}.tgz" oci://ghcr.io/arkeep-io/charts
          helm push "${chart_dir}/arkeep-${version}.tgz" oci://registry-1.docker.io/arkeepio