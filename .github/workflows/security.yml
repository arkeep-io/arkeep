name: Security

on:
  schedule:
    - cron: "0 8 * * 1"   # every Monday at 08:00 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  # ─── Go static security analysis ────────────────────────────────────────────
  gosec:
    name: Go Security Scan
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        module: [shared, server, agent]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Download agent deps (restic + rclone) for agent module
        if: matrix.module == 'agent'
        run: cd agent && go run ./scripts/download_deps.go

      # Installed via `go install` instead of the securego/gosec Docker action:
      # the action's image bundles its own Go (with GOTOOLCHAIN=local) and
      # cannot load packages when go.work requires a newer Go version.
      #
      # Pinned to a master commit until a tagged release ships it: v2.29.0
      # bundles golang.org/x/tools v0.49.0, which cannot read the export data
      # (version 5) written by Go 1.27.2 ("export data version 5 is greater
      # than maximum supported version 4"). This commit bumps x/tools to
      # v0.51.0. Switch back to a release tag once one is available.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261009120814-7b1b5cebe007

      # Run from inside the module: `gosec ./<module>/...` from the workspace
      # root resolves the packages but analyzes 0 files.
      #
      # Path-scoped exclusions (by design, kept here instead of #nosec):
      #   hooks/runner.go  G204     — pre/post hooks run admin-configured shell commands
      #   restic/wrapper.go G204    — invokes the extracted restic binary by path
      #   restic/extractor.go G302  — extracted restic/rclone binaries must be executable (0755)
      #   api/auth.go      G124     — Secure flag follows --secure-cookies (off for plain-HTTP LAN installs)
      #   api/auth.go      G710     — OIDC login redirects to the configured IdP authorization URL
      - name: Run gosec on ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: >-
          gosec -exclude-generated
          -exclude-rules='internal/hooks/runner\.go:G204;internal/restic/wrapper\.go:G204;internal/restic/extractor\.go:G302;internal/api/auth\.go:G124,G710'
          ./...

  # ─── Container vulnerability scan ───────────────────────────────────────────
  trivy:
    name: Container Vulnerability Scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Download agent deps (restic + rclone)
        run: cd agent && go run ./scripts/download_deps.go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          tags: arkeep-server:scan
          load: true
          push: false

      - name: Build agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          tags: arkeep-agent:scan
          load: true
          push: false

      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: arkeep-server:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          version: v0.76.1

      - name: Scan agent image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: arkeep-agent:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          version: v0.76.1
