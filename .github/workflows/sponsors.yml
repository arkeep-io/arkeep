name: Sponsors

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"   # every day at 03:30 UTC

# All writes go through SPONSORS_PR_PAT (main is protected and only accepts
# PRs), so GITHUB_TOKEN only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: sponsors
  cancel-in-progress: false

jobs:
  # ─── Refresh README sponsor avatars ─────────────────────────────────────────
  update:
    name: Update README sponsors
    runs-on: ubuntu-latest
    steps:
      # Always start from main: a manual run dispatched from develop would
      # otherwise carry unreleased develop changes into the PR against main.
      - uses: actions/checkout@v7
        with:
          ref: main

      # SPONSORS_PAT reads arkeep-io's sponsorships: GITHUB_TOKEN has no access
      # to the Sponsors GraphQL API. With organization: true the action queries
      # the repository owner (arkeep-io). active-only: false keeps past and
      # one-time sponsors; include-private is pinned to false so private
      # sponsors are never rendered.
      #
      # The action does not fetch avatarUrl and falls back to
      # https://github.com/<login>.png, so the template builds that URL itself
      # with ?size=120 for a sharp 60px avatar on HiDPI screens. Every
      # placeholder is HTML-escaped (the action rewrites {{{ }}} to {{ }}).
      - name: Generate sponsor avatars
        uses: JamesIves/github-sponsors-readme-action@v1
        with:
          token: ${{ secrets.SPONSORS_PAT }}
          file: README.md
          organization: true
          active-only: false
          include-private: false
          template: '<a href="https://github.com/{{ login }}"><img src="https://github.com/{{ login }}.png?size=120" width="60" height="60" alt="{{#name}}{{ name }}{{/name}}{{^name}}{{ login }}{{/name}}" /></a>'

      # Opens (or updates) a PR against main only when README.md changed; with
      # no diff the action does nothing. The PR is created with a PAT instead of
      # GITHUB_TOKEN because PRs opened by GITHUB_TOKEN don't trigger the
      # required CI checks. No [skip ci] in the message for the same reason.
      # The commit subject is excluded from the release changelog in
      # .goreleaser.yml.
      - name: Open sponsors PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SPONSORS_PR_PAT }}
          base: main
          branch: chore/sponsors
          delete-branch: true
          add-paths: README.md
          commit-message: "docs(readme): update sponsors"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: "docs(readme): update sponsors"
          body: Automated update of the Sponsors section from GitHub Sponsors (arkeep-io).
          labels: no-changelog
