name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: read-all

jobs:
  # ─── Dependency pinning (ADR 0013) ──────────────────────────────────────────
  pins:
    name: Check dependency pins
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependency pins
        run: scripts/check-pins.sh

  # ─── Go tests ───────────────────────────────────────────────────────────────
  test-go:
    name: Test Go
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            server/go.sum
            agent/go.sum
            shared/go.sum

      # protoc publishes no signature or attestation: its digest was recorded
      # from the release asset when it was pinned (ADR 0013). The Go code
      # generators come from tools/go.mod, verified by tools/go.sum.
      - name: Install protoc and code generators
        env:
          PROTOC_VERSION: "29.3"
          PROTOC_SHA256: 3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
        run: |
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          sudo unzip -q -o "$RUNNER_TEMP/protoc.zip" -d /usr/local bin/protoc 'include/*'
          cd tools && GOWORK=off go install tool

      - name: Generate proto
        run: |
          protoc \
            --go_out=shared/proto \
            --go_opt=paths=source_relative \
            --go-grpc_out=shared/proto \
            --go-grpc_opt=paths=source_relative \
            -I shared/proto \
            shared/proto/agent.proto

      - name: Download agent deps (restic + rclone)
        run: cd agent && go run ./scripts/download_deps.go

      - name: Test shared
        run: cd shared && go test -v -race -count=1 -timeout 20m ./...

      - name: Test server
        run: cd server && go test -v -race -count=1 -timeout 20m ./...

      - name: Test agent
        run: cd agent && go test -v -race -count=1 -timeout 20m ./...

  # ─── Go lint ────────────────────────────────────────────────────────────────
  # golangci-lint does not support go.work multi-module workspaces with ./...
  # from the root. We run it once per module so each module's go.mod is used
  # as the lint root, which avoids the "directory prefix does not contain
  # modules listed in go.work" error.
  lint-go:
    name: Lint Go
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        module: [shared, server, agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work

      - name: Download agent deps (restic + rclone) for agent module
        if: matrix.module == 'agent'
        run: cd agent && go run ./scripts/download_deps.go

      - name: Lint ${{ matrix.module }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
        env:
          GOTOOLCHAIN: auto

  # ─── Agent cross-compile smoke check ───────────────────────────────────────
  # Verifies the agent still builds for the embedded Linux targets shipped by
  # goreleaser (armv7, mips, mipsle — e.g. DVB-S2 receivers). Build-only:
  # these architectures can't run in the CI runner, so this catches
  # embed/extractor regressions without proving runtime behavior on real
  # hardware.
  build-agent-embedded:
    name: Build agent (embedded targets)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work

      - name: Download agent deps (restic + rclone) for all release platforms
        run: cd agent && go run ./scripts/download_deps.go --all-platforms

      - name: Cross-compile for linux/arm, linux/mips, linux/mipsle
        run: |
          cd agent
          GOOS=linux GOARCH=arm    GOARM=7 CGO_ENABLED=0 GOWORK=off go build -o /dev/null ./cmd/agent
          GOOS=linux GOARCH=mips           CGO_ENABLED=0 GOWORK=off go build -o /dev/null ./cmd/agent
          GOOS=linux GOARCH=mipsle         CGO_ENABLED=0 GOWORK=off go build -o /dev/null ./cmd/agent

  # ─── GUI ────────────────────────────────────────────────────────────────────
  test-gui:
    name: Test GUI
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node >= 25 no longer bundles corepack. pnpm/action-setup installs the
      # version pinned by packageManager in gui/package.json, and must run
      # before setup-node so its pnpm cache lookup can find the binary.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: gui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install dependencies
        run: cd gui && pnpm install --frozen-lockfile

      - name: Build (includes vue-tsc type check)
        run: cd gui && pnpm build

      - name: Test
        run: cd gui && pnpm test