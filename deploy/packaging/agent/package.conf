# Installed by the arkeep-agent .deb and .rpm packages as a drop-in of
# deploy/systemd/arkeep-agent.service, which they ship unchanged. Packages put
# the binary in /usr/bin, not in /usr/local/bin where a manual install puts
# it. The drop-in also applies to a unit left in /etc/systemd/system by an
# earlier manual install, which then runs the packaged binary too.
[Service]
ExecStart=
ExecStart=/usr/bin/arkeep-agent --state-dir=/var/lib/arkeep-agent
