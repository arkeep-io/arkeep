apiVersion: v2
name: arkeep
description: Centralized backup management for self-hosted infrastructure
type: application
# Placeholder for installs from a clone. A release publishes the chart with
# version and appVersion taken from its tag (ADR 0014).
version: 0.1.0
# Arkeep release deployed by default (image tag). Kept in sync with the latest
# release by .github/workflows/deps-pins.yml (ADR 0013), like the compose examples.
appVersion: "v0.10.0"
icon: https://arkeep.io/apple-touch-icon.png

keywords:
  - backup
  - restic
  - self-hosted
  - infrastructure

home: https://arkeep.io
sources:
  - https://github.com/arkeep-io/arkeep

maintainers:
  - name: arkeep-io
    url: https://github.com/arkeep-io

# Read by Artifact Hub (https://artifacthub.io/docs/topics/annotations/helm/).
annotations:
  artifacthub.io/category: storage
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://arkeep.io/docs/installation/kubernetes/
    - name: support
      url: https://github.com/arkeep-io/arkeep/issues
