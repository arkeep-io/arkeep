apiVersion: v2
name: arkeep
description: Centralized backup management for self-hosted infrastructure
type: application
version: 0.1.0
# Arkeep release deployed by default (image tag). Kept in sync with the latest
# release by .github/workflows/deps-pins.yml (ADR 0013), like the compose examples.
appVersion: "v0.9.1"

keywords:
  - backup
  - restic
  - self-hosted
  - infrastructure

home: https://github.com/arkeep-io/arkeep
sources:
  - https://github.com/arkeep-io/arkeep

maintainers:
  - name: arkeep-io
    url: https://github.com/arkeep-io

dependencies:
  # PostgreSQL subchart — enabled only when postgresql.enabled is true.
  # When disabled, configure an external database via externalPostgresql.
  - name: postgresql
    version: "16.7.27"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled