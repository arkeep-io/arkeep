version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "none"
  BUILD_DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "unknown"
  LDFLAGS: "-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.BUILD_DATE}}"

  # Versions and SHA-256 digests of the embedded restic and rclone binaries
  # live in agent/scripts/deps.json (task deps:pins:update).

tasks:
  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    desc: Build all components
    deps: [build:server, build:agent]

  build:gui:
    desc: Build the Vue GUI (output to gui/dist/)
    dir: gui
    cmd: pnpm build

  build:server:
    desc: Build server binary (builds GUI first and embeds it)
    deps: [build:gui]
    dir: server
    cmds:
      - cp -r ../gui/dist/. cmd/server/dist
      - go build -ldflags="{{.LDFLAGS}}" -o ../bin/arkeep-server ./cmd/server

  build:agent:
    desc: Build agent binary (embeds restic + rclone — downloads them first if missing)
    deps: [deps:download]
    dir: agent
    cmd: go build -ldflags="{{.LDFLAGS}}" -o ../bin/arkeep-agent ./cmd/agent

  # ─── Embedded dependencies ──────────────────────────────────────────────────
  deps:download:
    desc: Download restic and rclone binaries for the current platform into agent/internal/restic/bin/
    # Uses a pure-Go script so that the same command works identically on
    # Linux, macOS, and Windows (cmd.exe) without requiring bash, curl,
    # bzip2, or unzip. The script is idempotent: already-present binaries
    # are skipped. To force a re-download, delete the bin/ directory first.
    dir: agent
    cmd: go run ./scripts/download_deps.go

  deps:download:restic:
    desc: Download restic binary for the current platform (delegates to the shared Go script)
    dir: agent
    cmd: go run ./scripts/download_deps.go

  deps:download:rclone:
    desc: Download rclone binary for the current platform (delegates to the shared Go script)
    dir: agent
    cmd: go run ./scripts/download_deps.go

  # ─── Dependency maintenance (ADR 0013) ──────────────────────────────────────
  # Day to day, Dependabot and .github/workflows/deps-pins.yml keep every pin
  # current with weekly pull requests. These tasks do the same by hand.
  tools:install:
    desc: Install the pinned development tools (protoc plugins, govulncheck, gosec, Task) into GOBIN
    dir: tools
    env: { GOWORK: "off" }
    cmd: go install tool

  deps:pins:check:
    desc: Fail if a dependency is not pinned as required by ADR 0013
    cmd: bash scripts/check-pins.sh

  deps:pins:update:
    desc: Update restic and rclone to their latest releases (7-day cooldown), with GPG-verified SHA-256 pins
    cmd: bash agent/scripts/update-deps-pins.sh

  deps:vulncheck:
    desc: Check Go modules and GUI dependencies for known vulnerabilities
    cmds:
      # Built from tools/go.mod: "go tool -modfile" is not allowed in workspace mode.
      - cd tools && GOWORK=off go build -o ../bin/tools/ golang.org/x/vuln/cmd/govulncheck
      - for: [shared, server, agent]
        cmd: cd {{.ITEM}} && ../bin/tools/govulncheck ./...
      - cd gui && pnpm audit --audit-level high

  deps:update:
    desc: Bump every Go and npm dependency to its latest version, then re-check pins and vulnerabilities
    # Base images, compose images and actions are bumped by Dependabot (their
    # digests and SHAs are resolved against the registries), and restic/rclone
    # by deps:pins:update.
    cmds:
      - for: [shared, server, agent]
        cmd: cd {{.ITEM}} && go get -u ./... && go mod tidy
      - cd tools && GOWORK=off go get -u tool && GOWORK=off go mod tidy
      - cd gui && pnpm update --latest
      - task: deps:pins:check
      - task: deps:vulncheck

  # ─── Run (development) ──────────────────────────────────────────────────────
  run:server:
    desc: Run server in development mode
    dir: server
    cmd: go run ./cmd/server --log-level=debug --grpc-insecure
    env:
      ARKEEP_SECRET_KEY: dev-secret-key-00000000000000000
      ARKEEP_AGENT_SECRET: dev-agent-secret
      ARKEEP_TELEMETRY: "false"

  run:agent:
    desc: Run agent in development mode (downloads deps if needed)
    deps: [deps:download]
    dir: agent
    cmd: go run ./cmd/agent --server-addr=localhost:9090 --log-level=debug --grpc-insecure
    env:
      ARKEEP_AGENT_SECRET: dev-agent-secret
  
  run:gui:
    desc: Run GUI in development mode
    dir: gui
    cmd: pnpm dev

  run:dev:
    desc: Run server + GUI in development mode
    deps: [run:server, run:gui]

  # ─── Test ───────────────────────────────────────────────────────────────────
  test:
    desc: Run all tests
    deps: [test:shared, test:server, test:agent, test:gui]

  test:shared:
    desc: Run shared tests
    dir: shared
    cmd: go test -v -count=1 ./...

  test:server:
    desc: Run server tests
    dir: server
    cmd: go test -v -count=1 ./...

  test:agent:
    desc: Run agent tests
    dir: agent
    cmd: go test -v -count=1 ./...

  test:gui:
    desc: Run GUI tests
    dir: gui
    cmd: pnpm test

  # ─── Proto ──────────────────────────────────────────────────────────────────
  proto:
    desc: Generate Go code from protobuf definitions
    cmds:
      - protoc --go_out=shared/proto --go_opt=paths=source_relative --go-grpc_out=shared/proto --go-grpc_opt=paths=source_relative -I shared/proto shared/proto/agent.proto
    sources:
      - shared/proto/*.proto
    generates:
      - shared/proto/**/*.pb.go
      - shared/proto/**/*_grpc.pb.go

  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    desc: Run Go linter (server module)
    dir: server
    cmd: golangci-lint run ./...

  # ─── Tidy ───────────────────────────────────────────────────────────────────
  tidy:
    desc: Tidy all Go modules
    cmds:
      - cd shared && go mod tidy
      - cd server && go mod tidy
      - cd agent && go mod tidy

  # ─── Clean ──────────────────────────────────────────────────────────────────
  clean:
    desc: Remove build artifacts
    cmds:
      - cmd: rm -rf bin/
        ignore_error: true
        platforms: [linux, darwin]
      - cmd: cmd /c "if exist bin rmdir /s /q bin"
        ignore_error: true
        platforms: [windows]