version: 2

project_name: arkeep

before:
  hooks:
    - sh -c "cd gui && pnpm install --frozen-lockfile && pnpm build"
    - sh -c "mkdir -p server/cmd/server/dist && cp -r gui/dist/. server/cmd/server/dist"
    - sh -c "cd agent && go run ./scripts/download_deps.go --all-platforms"

builds:
  - id: server
    binary: arkeep-server
    main: ./cmd/server
    dir: server
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: agent
    binary: arkeep-agent
    main: ./cmd/agent
    dir: agent
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # Linux-only targets for embedded backup sources (e.g. DVB-S2 receivers).
  # Kept as a separate build id rather than extending the agent build's
  # matrix, to avoid a long ignore: list for the darwin/windows combinations
  # that don't apply to these architectures.
  - id: agent-embedded
    binary: arkeep-agent
    main: ./cmd/agent
    dir: agent
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
    goarch:
      - arm
      - mips
      - mipsle
    goarm:
      - "7"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: server
    ids: [server]
    name_template: "arkeep-server_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - deploy/systemd/arkeep-server.service

  - id: agent
    ids: [agent, agent-embedded]
    name_template: "arkeep-agent_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - deploy/systemd/arkeep-agent.service

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# dockers_v2 builds one multi-platform image per entry with buildx and
# pushes the manifest list directly, replacing the deprecated dockers +
# docker_manifests pair. Binaries are placed in the build context under
# $TARGETPLATFORM/ (e.g. linux/amd64/arkeep-server).
dockers_v2:
  - id: server
    ids: [server]
    dockerfile: server/Dockerfile.goreleaser
    images:
      - "ghcr.io/arkeep-io/arkeep-server"
      - "docker.io/arkeepio/arkeep-server"
    # A pre-release gets its version tag only: latest moves on stable
    # releases. An empty tag is skipped.
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "arkeep-server"
      "org.opencontainers.image.description": "Arkeep server: web UI, REST API and gRPC hub for self-hosted Restic and Rclone backups"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .Commit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.source": "https://github.com/arkeep-io/arkeep"
      "org.opencontainers.image.url": "https://arkeep.io"
      "org.opencontainers.image.documentation": "https://arkeep.io/docs/"
      "org.opencontainers.image.vendor": "Arkeep"
      "org.opencontainers.image.licenses": "Apache-2.0"
    # GHCR reads the description of a multi-platform image from the index
    # annotation, not from the image labels.
    annotations:
      "index:org.opencontainers.image.description": "Arkeep server: web UI, REST API and gRPC hub for self-hosted Restic and Rclone backups"

  - id: agent
    ids: [agent]
    dockerfile: agent/Dockerfile.goreleaser
    extra_files:
      - agent/entrypoint.sh
    images:
      - "ghcr.io/arkeep-io/arkeep-agent"
      - "docker.io/arkeepio/arkeep-agent"
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "arkeep-agent"
      "org.opencontainers.image.description": "Arkeep agent: backs up a machine with embedded Restic and Rclone, driven by an Arkeep server"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .Commit }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.source": "https://github.com/arkeep-io/arkeep"
      "org.opencontainers.image.url": "https://arkeep.io"
      "org.opencontainers.image.documentation": "https://arkeep.io/docs/"
      "org.opencontainers.image.vendor": "Arkeep"
      "org.opencontainers.image.licenses": "Apache-2.0"
    annotations:
      "index:org.opencontainers.image.description": "Arkeep agent: backs up a machine with embedded Restic and Rclone, driven by an Arkeep server"

# `use: github` resolves each commit's GitHub login, so every entry can credit
# its author with an @mention (GitHub then renders the contributor avatars on
# the release page). GoReleaser already prefixes each entry with a bullet, so
# `format` must not add its own — a leading "- " renders as a nested list.
changelog:
  use: github
  sort: asc
  abbrev: 7
  format: "{{ .Message }} ({{ .SHA }}){{ with .AuthorUsername }} by @{{ . }}{{ end }}"
  # A commit lands in Breaking Changes only when its type carries a "!"
  # (feat!:, fix(api)!:): mark every change that needs action on upgrade.
  # docs and refactor commits are left out (see filters): they concern
  # contributors, and the Full Changelog link still lists them.
  groups:
    - title: "⚠️ Breaking Changes"
      regexp: '^.*![:(]|^BREAKING CHANGE:'
      order: 0
    - title: "🚀 Features"
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: "🐛 Bug Fixes"
      regexp: '^fix(\(.+\))?:'
      order: 2
    - title: "⚡ Performance"
      regexp: '^perf(\(.+\))?:'
      order: 3
    - title: "🏗️ Build & CI"
      regexp: '^(build|ci)(\(.+\))?:'
      order: 4
    - title: "🧹 Maintenance"
      regexp: '^chore(\(.+\))?:'
      order: 5
    - title: "🔧 Other Changes"
      order: 999
  filters:
    exclude:
      - '^test(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^docs(\(.+\))?:'
      - '^refactor(\(.+\))?:'
      - '^Merge pull request'
      - '^Merge branch'
      - '^merge '
      - '^revert: merge '
      - '^chore\(deps\):'
      - '^chore\(release\):'

release:
  github:
    owner: arkeep-io
    name: arkeep
  prerelease: auto
  # CONTRIBUTORS is computed by the release workflow (see
  # .github/workflows/release.yml); envOrDefault keeps local
  # `goreleaser release --snapshot` runs working without it.
  header: |
    {{- if .Prerelease }}
    > [!WARNING]
    > This is a pre-release. It may contain bugs or incomplete features — avoid running it in production.
    {{ end }}
    > [!IMPORTANT]
    > Database migrations run automatically when the server starts. Back up your database (or the `data/` volume) before upgrading — see [Upgrading](https://arkeep.io/docs/installation/upgrading/).

    ## 📦 Install

    ```bash
    docker pull ghcr.io/arkeep-io/arkeep-server:{{ .Tag }}
    docker pull ghcr.io/arkeep-io/arkeep-agent:{{ .Tag }}
    ```

    Kubernetes: `helm install arkeep oci://ghcr.io/arkeep-io/charts/arkeep --version {{ .Version }}` (also `oci://registry-1.docker.io/arkeepio/arkeep`).

    Images are also published on Docker Hub (`arkeepio/arkeep-server`, `arkeepio/arkeep-agent`) for `linux/amd64` and `linux/arm64`. Standalone binaries — server for Linux and macOS, agent for Linux (amd64, arm64, armv7, mips, mipsle), macOS and Windows — are attached below. See the [installation docs](https://arkeep.io/docs/installation/docker-compose/) for Docker Compose, binary and Helm setups.

  footer: |
    {{- with envOrDefault "CONTRIBUTORS" "" }}
    ## ❤️ New Contributors

    Welcome and thanks to the first-time contributors of this release: {{ . }}
    {{ end }}
    ## 🔐 Verify

    ```bash
    sha256sum --check --ignore-missing checksums.txt
    ```
    {{ if .PreviousTag }}
    **Full Changelog**: https://github.com/arkeep-io/arkeep/compare/{{ .PreviousTag }}...{{ .Tag }}
    {{- end }}